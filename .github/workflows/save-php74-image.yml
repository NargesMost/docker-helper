name: Save PHP 7.4 Apache Image as TAR (GitHub Releases)

on:
  workflow_dispatch:

jobs:
  save-image:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull php:7.4-apache image
        run: docker pull php:7.4-apache

      - name: Save image to TAR
        run: docker save php:7.4-apache -o php74-apache.tar

      - name: Create Release and upload TAR
        uses: softprops/action-gh-release@v2
        with:
          tag_name: php74-apache
          name: PHP 7.4 Apache TAR Image
          files: php74-apache.tar
